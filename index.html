<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新西兰南岛包车线路</title>
<meta name="description" content="新西兰南岛中线、东线、西线包车旅游线路讲解地图：途经地、驾车时长、住宿费用、推荐活动与包车报价。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2327; --muted: #67707a; --line: #e4e2dc;
    --soft: #f1efe9; --accent: #2f6fde; --ok: #1a9c6b; --warn: #c2410c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .app { display: grid; grid-template-columns: 440px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  #map { height: 100%; background: #dfe8ec; }

  header { padding: 20px 20px 12px; }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .tabs { display: flex; gap: 6px; padding: 0 20px 14px; position: sticky; top: 0; background: var(--panel); z-index: 5; padding-top: 10px; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 4px; cursor: pointer; font: inherit; color: var(--ink); text-align: center; }
  .tab b { display: block; font-size: 15px; }
  .tab small { color: var(--muted); font-size: 11px; }
  .tab.on { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }
  .tab.on small { color: rgba(255,255,255,.85); }

  section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .desc { color: var(--muted); margin: 0 0 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .stat .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; color: var(--muted); }

  .timeline { position: relative; }
  .stop { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; transition: box-shadow .15s, border-color .15s; background: var(--panel); }
  .stop:hover { border-color: #c9c6bd; }
  .stop.active { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 25%, transparent); }
  .stop-h { display: flex; align-items: center; gap: 10px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .stop-h .nm { font-weight: 700; font-size: 15px; }
  .stop-h .en { color: var(--muted); font-size: 12px; }
  .stop-h .tag { margin-left: auto; font-size: 12px; white-space: nowrap; text-align: right; }
  .tag .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .tag .pill.stay { background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-weight: 600; }
  .intro { color: var(--muted); font-size: 13px; margin: 8px 0 6px; }
  .acts { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acts td { padding: 5px 4px; border-top: 1px dashed var(--line); vertical-align: top; }
  .acts td.p { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  .acts td.d { color: var(--muted); white-space: nowrap; width: 1%; }
  .acts td.ck { width: 22px; }
  .acts .free { color: var(--ok); }
  .acts .t { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
  .leg { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 12px; margin-left: 12px; border-left: 3px dotted var(--c); cursor: pointer; color: var(--muted); font-size: 13px; }
  .leg:hover .drive { background: var(--c); color: #fff; }
  .leg .drive { background: var(--soft); color: var(--ink); border-radius: 8px; padding: 3px 10px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background .15s; }
  .leg.active .drive { background: var(--c); color: #fff; }

  .veh { display: grid; gap: 8px; }
  .vcard { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .vcard .ico { font-size: 28px; }
  .vcard .vn { font-weight: 700; }
  .vcard .vd { color: var(--muted); font-size: 12px; }
  .vcard .vp { margin-left: auto; text-align: right; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .vcard .vp small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .vcard.on { border-color: var(--ink); box-shadow: 0 0 0 2px rgba(29,35,39,.15); }
  .vcard.off { opacity: .4; cursor: not-allowed; }
  .row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
  .step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .step button { border: 0; background: var(--soft); width: 32px; height: 32px; font-size: 18px; cursor: pointer; color: var(--ink); }
  .step span { min-width: 44px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .quote { margin-top: 12px; background: var(--soft); border-radius: 12px; padding: 12px 14px; }
  .quote .ln { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .quote .ln span:first-child { color: var(--muted); }
  .quote .tot { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: 17px; font-weight: 700; }
  .quote .tot span:first-child { color: var(--ink); }
  .fine { font-size: 11px; color: var(--muted); margin: 10px 0 0; }

  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmp th, table.cmp td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* 讲解模式控制条 */
  .tour { position: absolute; z-index: 1000; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96); border-radius: 14px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .tour button { border: 0; background: var(--soft); border-radius: 10px; height: 38px; min-width: 38px; padding: 0 12px; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .tour button.play { background: var(--c, var(--ink)); color: #fff; }
  .tour .lbl { padding: 0 8px; font-size: 13px; min-width: 120px; text-align: center; font-weight: 600; }
  .mapwrap { position: relative; }

  .pin { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .pin.small { width: 14px; height: 14px; border-width: 2px; }
  .leaflet-tooltip.legtip { background: #fff; border: 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); font-weight: 700; font-size: 12px; padding: 2px 8px; color: var(--ink); }
  .leaflet-tooltip.legtip::before { display: none; }
  .leaflet-tooltip.nametip { background: transparent; border: 0; box-shadow: none; font-weight: 700; font-size: 12px; color: #1d2327; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; padding: 0; }
  .leaflet-tooltip.nametip::before { display: none; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.5; min-width: 220px; }
  .pp h3 { margin: 0; font-size: 16px; }
  .pp .en { color: var(--muted); font-size: 12px; }
  .pp ul { margin: 6px 0 0; padding-left: 16px; }
  .pp .meta { margin-top: 6px; font-weight: 600; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; height: 100dvh; }
    .mapwrap { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    header { padding: 14px 16px 6px; }
    .tabs, section { padding-left: 16px; padding-right: 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tour { bottom: 10px; }
    .tour .lbl { min-width: 0; font-size: 12px; white-space: nowrap; }
    .tour button { padding: 0 10px; }
    .crowded .legtip { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <header>
      <h1>🇳🇿 新西兰南岛包车之旅</h1>
      <p>三条经典线路 · 途经地 · 驾车时长 · 住宿 · 活动 · 包车报价</p>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <div id="content"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="tour" id="tour">
      <button id="prev" title="上一站">◀</button>
      <button id="play" class="play">▶ 讲解</button>
      <span class="lbl" id="tourLbl">点击开始讲解</span>
      <button id="next" title="下一站">▶</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="geo.js"></script>
<script>
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const hm = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${h} 小时${r ? ' ' + r + ' 分' : ''}` : `${r} 分钟`; };
const hmShort = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? String(r).padStart(2, '0') : ''}` : `${r}min`; };
const geo = (a, b) => GEO[[a, b].sort().join('-')];

const state = { route: 'central', people: 2, vehicle: 'benz-suv', days: null, picks: {}, tourIdx: -1, playing: null };

function routeStats(r) {
  const km = r.legs.reduce((s, _, i) => s + geo(r.stops[i], r.stops[i + 1]).km, 0);
  const drive = r.legs.reduce((a, b) => a + b, 0);
  const nights = r.nights.reduce((a, b) => a + b, 0);
  const stay = r.stops.reduce((s, id, i) => s + PLACES[id].stay * r.nights[i], 0);
  return { km, drive, nights, days: nights + 1, stay };
}

/* ---------- 地图 ---------- */
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([-44.0, 170.3], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const toggleCrowded = () => map.getContainer().classList.toggle('crowded', map.getZoom() < 8 && map.getSize().x < 600);
map.on('zoomend resize', toggleCrowded);

const routeLayers = {};   // id -> { lines: [polyline per leg], group }
let activeLayer = L.layerGroup().addTo(map);
let highlight = null;

ROUTES.forEach(r => {
  const group = L.layerGroup().addTo(map);
  const lines = r.legs.map((_, i) => {
    const a = r.stops[i], b = r.stops[i + 1];
    let path = geo(a, b).path;
    if ([a, b].sort()[0] !== a) path = path.slice().reverse();
    return L.polyline(path, { color: r.color, weight: 4, opacity: .9 }).addTo(group)
      .on('click', () => { if (state.route !== r.id) setRoute(r.id); focusLeg(i); });
  });
  routeLayers[r.id] = { lines, group };
});

function popupHtml(id, r) {
  const p = PLACES[id];
  const idx = r ? r.stops.map((s, i) => s === id ? i : -1).filter(i => i >= 0) : [];
  const n = idx.reduce((s, i) => s + r.nights[i], 0);
  const top = p.acts.slice(0, 3).map(a => `<li>${a.n} · ${a.p ? money(a.p) : '免费'} · ${a.d}</li>`).join('');
  return `<div class="pp"><h3>${p.name}</h3><div class="en">${p.en}</div>
    <div style="margin-top:6px">${p.intro}</div>
    <div class="meta">${n ? `住 ${n} 晚 · 约 ${money(p.stay)}/人/晚` : '途经 / 一日游，不住宿'}</div>
    <ul>${top}</ul></div>`;
}

function drawActive() {
  activeLayer.clearLayers();
  const showAll = state.route === 'all';
  ROUTES.forEach(r => {
    const on = showAll || r.id === state.route;
    routeLayers[r.id].lines.forEach(l => l.setStyle({ weight: on ? 5 : 3, opacity: on ? .95 : .18, dashArray: on ? null : '4 6' }));
    if (on) routeLayers[r.id].group.eachLayer(l => l.bringToFront());
  });
  const routes = showAll ? ROUTES : [ROUTES.find(r => r.id === state.route)];
  const seen = {};
  routes.forEach(r => {
    // 站点编号（同一地点出现多次时合并编号）
    const nums = {};
    r.stops.forEach((id, i) => (nums[id] = nums[id] || []).push(i + 1));
    Object.entries(nums).forEach(([id, ns]) => {
      if (showAll && seen[id]) return;
      seen[id] = 1;
      const p = PLACES[id];
      const label = showAll ? '' : ns.join('·');
      const icon = L.divIcon({ className: '', iconSize: showAll ? [14, 14] : [30, 30], iconAnchor: showAll ? [7, 7] : [15, 15],
        html: `<div class="pin ${showAll ? 'small' : ''}" style="background:${r.color}">${label}</div>` });
      L.marker([p.lat, p.lng], { icon, riseOnHover: true }).addTo(activeLayer)
        .bindTooltip(p.name, { permanent: true, direction: 'right', offset: [showAll ? 8 : 14, 0], className: 'nametip' })
        .bindPopup(popupHtml(id, showAll ? null : r))
        .on('click', () => { if (!showAll) markStop(r.stops.indexOf(id)); });
    });
    if (!showAll) {
      r.legs.forEach((m, i) => {
        const path = geo(r.stops[i], r.stops[i + 1]).path;
        const mid = path[Math.floor(path.length / 2)];
        L.tooltip({ permanent: true, direction: 'center', className: 'legtip' }).setLatLng(mid).setContent('🚗 ' + hmShort(m)).addTo(activeLayer);
      });
    }
  });
  const pts = routes.flatMap(r => r.stops.map(id => [PLACES[id].lat, PLACES[id].lng]));
  map.flyToBounds(L.latLngBounds(pts).pad(.12), { duration: .8 });
}

function focusLeg(i) {
  const r = ROUTES.find(r => r.id === state.route);
  if (highlight) map.removeLayer(highlight);
  const line = routeLayers[r.id].lines[i];
  highlight = L.polyline(line.getLatLngs(), { color: '#111', weight: 9, opacity: .25 }).addTo(map);
  line.bringToFront();
  map.flyToBounds(line.getBounds().pad(.25), { duration: .8 });
  document.querySelectorAll('.leg, .stop').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`.leg[data-i="${i}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function markStop(i) {
  document.querySelectorAll('.leg, .stop').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`.stop[data-i="${i}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function focusStop(i, zoom = 10) {
  const r = ROUTES.find(r => r.id === state.route);
  const id = r.stops[i], p = PLACES[id];
  if (highlight) { map.removeLayer(highlight); highlight = null; }
  if (i > 0) {
    const line = routeLayers[r.id].lines[i - 1];
    highlight = L.polyline(line.getLatLngs(), { color: '#111', weight: 9, opacity: .25 }).addTo(map);
    line.bringToFront();
  }
  map.flyTo([p.lat, p.lng], zoom, { duration: 1.2 });
  L.popup({ offset: [0, -12] }).setLatLng([p.lat, p.lng]).setContent(popupHtml(id, r)).openOn(map);
  markStop(i);
}

/* ---------- 侧边栏 ---------- */
function renderTabs() {
  const items = [...ROUTES.map(r => ({ id: r.id, name: r.name, sub: r.sub.split(' · ')[0], color: r.color })),
    { id: 'all', name: '全览', sub: '三线对比', color: '#1d2327' }];
  $('#tabs').innerHTML = items.map(t =>
    `<button class="tab ${state.route === t.id ? 'on' : ''}" style="--c:${t.color}" data-id="${t.id}"><b>${t.name}</b><small>${t.sub}</small></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => setRoute(b.dataset.id));
}

function vehicleHtml(days) {
  return `<section>
    <h2>🚐 包车车型与报价</h2>
    <div class="row">出行人数
      <span class="step"><button data-d="-1">−</button><span id="ppl">${state.people} 人</span><button data-d="1">+</button></span>
      ${state.route !== 'all' ? `包车天数 <span class="step"><button data-day="-1">−</button><span>${days} 天</span><button data-day="1">+</button></span>` : ''}
    </div>
    <div class="veh">${VEHICLES.map(v => {
      const off = v.pax < state.people;
      return `<div class="vcard ${state.vehicle === v.id ? 'on' : ''} ${off ? 'off' : ''}" data-v="${v.id}">
        <div class="ico">${v.img}</div>
        <div><div class="vn">${v.name}</div><div class="vd">${v.note}${off ? ' · 人数超出' : ''}</div></div>
        <div class="vp">${money(v.price)}<small>每天</small></div></div>`;
    }).join('')}</div>
  </section>`;
}

function bindVehicle() {
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    state.people = Math.min(5, Math.max(1, state.people + +b.dataset.d));
    const cur = VEHICLES.find(v => v.id === state.vehicle);
    if (cur.pax < state.people) state.vehicle = VEHICLES.find(v => v.pax >= state.people).id;
    render();
  });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const r = ROUTES.find(r => r.id === state.route);
    state.days = Math.max(1, (state.days ?? routeStats(r).days) + +b.dataset.day);
    render();
  });
  document.querySelectorAll('.vcard').forEach(c => c.onclick = () => {
    if (c.classList.contains('off')) return;
    state.vehicle = c.dataset.v; render();
  });
}

function renderRoute(r) {
  const s = routeStats(r);
  const days = state.days ?? s.days;
  const picks = state.picks[r.id] = state.picks[r.id] || {};
  const v = VEHICLES.find(v => v.id === state.vehicle);

  let tl = '';
  r.stops.forEach((id, i) => {
    const p = PLACES[id], n = r.nights[i];
    const repeat = r.stops.indexOf(id) < i;
    tl += `<div class="stop" data-i="${i}" style="--c:${r.color}">
      <div class="stop-h"><div class="num">${i + 1}</div>
        <div><div class="nm">${p.name}</div><div class="en">${p.en}</div></div>
        <div class="tag">${n ? `<span class="pill stay">住 ${n} 晚 · ${money(p.stay)}/人/晚</span>` : `<span class="pill">${i === 0 ? '出发' : '途经'}</span>`}</div>
      </div>
      ${repeat ? `<div class="intro">再次回到${p.name}${n ? '过夜' : ''}，活动见第 ${r.stops.indexOf(id) + 1} 站。</div>` : `
      <div class="intro">${p.intro}</div>
      <table class="acts">${p.acts.map((a, k) => {
        const key = id + ':' + k;
        return `<tr><td class="ck"><input type="checkbox" data-k="${key}" ${picks[key] ? 'checked' : ''} title="加入报价"></td>
          <td>${a.n}<span class="t">${a.t}</span></td><td class="d">⏱ ${a.d}</td>
          <td class="p ${a.p ? '' : 'free'}">${a.p ? money(a.p) : '免费'}</td></tr>`;
      }).join('')}</table>`}
    </div>`;
    if (i < r.legs.length) {
      const g = geo(id, r.stops[i + 1]);
      tl += `<div class="leg" data-i="${i}" style="--c:${r.color}"><span class="drive">🚗 ${hm(r.legs[i])}</span><span>${g.km} km${r.legNotes[i] ? ' · ' + r.legNotes[i] : ''}</span></div>`;
    }
  });

  const actPP = Object.keys(picks).filter(k => picks[k]).reduce((sum, k) => {
    const [id, idx] = k.split(':'); return sum + PLACES[id].acts[idx].p;
  }, 0);
  const car = v.price * days, stay = s.stay * state.people, act = actPP * state.people;
  const total = car + stay + act;

  $('#content').innerHTML = `
    <section>
      <h2 style="color:${r.color}">${r.name} · ${r.sub}</h2>
      <p class="desc">${r.desc}</p>
      <div class="stats">
        <div class="stat"><div class="v">${s.days}天${s.nights}晚</div><div class="k">建议行程</div></div>
        <div class="stat"><div class="v">${s.km.toLocaleString()}</div><div class="k">总里程 km</div></div>
        <div class="stat"><div class="v">${Math.round(s.drive / 6) / 10}h</div><div class="k">纯驾车时长</div></div>
        <div class="stat"><div class="v">${money(s.stay)}</div><div class="k">每人住宿合计</div></div>
      </div>
    </section>
    <section><h2>📍 途经地与每段车程</h2><p class="fine" style="margin:-4px 0 10px">勾选活动可加入下方报价 · 点击站点或车程在地图上定位</p><div class="timeline">${tl}</div></section>
    ${vehicleHtml(days)}
    <section style="border-bottom:0">
      <div class="quote">
        <div class="ln"><span>包车 ${v.name} × ${days} 天</span><span>${money(car)}</span></div>
        <div class="ln"><span>住宿 ${s.nights} 晚 × ${state.people} 人</span><span>${money(stay)}</span></div>
        <div class="ln"><span>已选活动 ${money(actPP)}/人 × ${state.people} 人</span><span>${money(act)}</span></div>
        <div class="ln tot"><span>合计（NZD）</span><span>${money(total)}</span></div>
        <div class="ln"><span>人均</span><span>${money(total / state.people)}</span></div>
      </div>
      <p class="fine">* 所有价格为新西兰元 (NZD) 旺季参考价，住宿按两人一间均摊；活动价格以各运营商官网为准；餐饮、机票、保险未计入。</p>
    </section>`;

  document.querySelectorAll('.stop').forEach(e => e.onclick = ev => { if (ev.target.tagName !== 'INPUT') { stopTour(); state.tourIdx = +e.dataset.i; focusStop(+e.dataset.i); updateTourLbl(); } });
  document.querySelectorAll('.leg').forEach(e => e.onclick = () => { stopTour(); focusLeg(+e.dataset.i); });
  document.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { picks[c.dataset.k] = c.checked; const y = $('aside').scrollTop; render(); $('aside').scrollTop = y; });
  bindVehicle();
}

function renderAll() {
  const v = VEHICLES.find(v => v.id === state.vehicle);
  const rows = ROUTES.map(r => {
    const s = routeStats(r);
    return `<tr><td><span class="dot" style="background:${r.color}"></span><b>${r.name}</b></td>
      <td>${s.days}天</td><td>${s.km.toLocaleString()}</td><td>${Math.round(s.drive / 6) / 10}h</td><td>${money(s.stay)}</td>
      <td>${money(v.price * s.days + s.stay * state.people)}</td></tr>`;
  }).join('');
  $('#content').innerHTML = `
    <section>
      <h2>三条线路对比</h2>
      <p class="desc">中线看雪山湖泊，东线看海岸野生动物，西线看冰川雨林。时间充裕可将西线与中线组合成南岛环线（约 14 天）。</p>
      <table class="cmp"><thead><tr><th>线路</th><th>天数</th><th>里程 km</th><th>驾车</th><th>住宿/人</th><th>包车+住宿*</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="fine">* 按当前选择：${state.people} 人，${v.name}（${money(v.price)}/天），不含活动。</p>
    </section>
    <section>
      <h2>线路特色</h2>
      ${ROUTES.map(r => `<p style="margin:0 0 10px"><span class="dot" style="background:${r.color}"></span><b>${r.name} · ${r.sub}</b><br><span class="desc">${r.stops.filter((x, i, a) => a.indexOf(x) === i).map(id => PLACES[id].name).join(' → ')}</span></p>`).join('')}
    </section>
    ${vehicleHtml(0)}`;
  bindVehicle();
}

function render() {
  renderTabs();
  const r = ROUTES.find(r => r.id === state.route);
  r ? renderRoute(r) : renderAll();
  $('#tour').style.display = r ? '' : 'none';
  $('#tour').style.setProperty('--c', r ? r.color : '#1d2327');
}

function setRoute(id) {
  stopTour();
  state.route = id; state.days = null; state.tourIdx = -1;
  if (highlight) { map.removeLayer(highlight); highlight = null; }
  map.closePopup();
  render(); drawActive(); updateTourLbl();
  $('aside').scrollTop = 0;
}

/* ---------- 讲解模式 ---------- */
function updateTourLbl() {
  const r = ROUTES.find(r => r.id === state.route);
  if (!r) return;
  const i = state.tourIdx;
  $('#tourLbl').textContent = i < 0 ? '点击开始讲解' : `${i + 1}/${r.stops.length} ${PLACES[r.stops[i]].name}`;
  $('#play').textContent = state.playing ? '⏸ 暂停' : '▶ 讲解';
}
function go(d) {
  const r = ROUTES.find(r => r.id === state.route);
  state.tourIdx = Math.min(r.stops.length - 1, Math.max(0, state.tourIdx + d));
  focusStop(state.tourIdx); updateTourLbl();
}
function stopTour() { clearInterval(state.playing); state.playing = null; updateTourLbl(); }
$('#prev').onclick = () => { stopTour(); go(-1); };
$('#next').onclick = () => { stopTour(); go(1); };
$('#play').onclick = () => {
  if (state.playing) return stopTour();
  const r = ROUTES.find(r => r.id === state.route);
  if (state.tourIdx >= r.stops.length - 1) state.tourIdx = -1;
  go(1);
  state.playing = setInterval(() => {
    if (state.tourIdx >= r.stops.length - 1) { stopTour(); drawActive(); return; }
    go(1);
  }, 5000);
  updateTourLbl();
};

render(); drawActive(); updateTourLbl();
</script>
</body>
</html>
