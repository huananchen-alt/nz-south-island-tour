<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新西兰包车线路</title>
<meta name="description" content="新西兰南岛中线、东线、西线、北岛及自由组合包车旅游线路讲解地图：途经地、驾车时长、住宿费用、推荐活动与包车报价。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2327; --muted: #67707a; --line: #e4e2dc;
    --soft: #f1efe9; --accent: #2f6fde; --ok: #1a9c6b; --warn: #c2410c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .app { display: grid; grid-template-columns: 440px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px 20px 6px; position: sticky; top: 0; background: var(--panel); z-index: 5; border-bottom: 1px solid var(--line); }

  .tab { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 3px 2px; cursor: pointer; font: inherit; color: var(--ink); text-align: center; min-width: 0; line-height: 1.25; }
  .tab b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab small { color: var(--muted); font-size: 10px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.on { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }
  .tab.on small { color: rgba(255,255,255,.85); }
  .start { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 1px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
  .seg button { border: 0; background: transparent; border-radius: 6px; padding: 2px 11px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

  .season { font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .season b { padding: 1px 7px; border-radius: 99px; color: #fff; margin-right: 5px; }
  .seg.ppl button { padding: 2px 0; width: 30px; font-variant-numeric: tabular-nums; }
  .vcard .cnt { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 600; }

  section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .desc { color: var(--muted); margin: 0 0 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .stat .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; color: var(--muted); }

  .timeline { position: relative; }

  .stop-h .en { color: var(--muted); font-size: 12px; }

  .intro { color: var(--muted); font-size: 13px; margin: 8px 0 6px; }
  .acts { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acts td { padding: 5px 4px; border-top: 1px dashed var(--line); vertical-align: top; }
  .acts td.p { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  .acts td.d { color: var(--muted); white-space: nowrap; width: 1%; }
  .acts td.ck { width: 22px; }
  .acts .free { color: var(--ok); }
  .acts .t { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
  .starbox { margin: 8px 0 4px; padding: 8px 10px; border-radius: 10px; background: #14163a; color: #e8e9ff; font-size: 12.5px; }
  .starbox b { color: #fff; }
  .starbox .warn { display: block; margin-top: 4px; color: #b9bce6; font-size: 11.5px; }
  .starbanner { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: linear-gradient(135deg, #14163a, #2b2f6b); color: #e8e9ff; font-size: 13px; }
  .starbanner h3 { margin: 0 0 4px; font-size: 14px; color: #fff; }
  .starbanner p { margin: 4px 0 0; }
  .starbanner .warn { color: #ffd88a; font-size: 12px; }
  .nstep { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; }

  .sdate { display: inline-block; font-size: 11px; color: var(--c); font-weight: 600; margin-left: 6px; }
  .tab.incart:not(.on) { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

  .cartbtn button { width: 100%; margin-top: 12px; border: 2px solid var(--c); background: var(--c); color: #fff; border-radius: 10px; padding: 10px; font: inherit; font-weight: 700; cursor: pointer; }

  .resets button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .resets button:hover { border-color: var(--warn); color: var(--warn); }
  .cart.empty { font-size: 13px; color: var(--muted); background: var(--soft); border: 0; }
  .cart h3 { margin: 0 0 8px; font-size: 15px; }
  .cart .citem { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 8px 0 8px 10px; border-left: 4px solid var(--c); margin-bottom: 6px; background: var(--soft); border-radius: 6px; }
  .cart .citem small { display: block; color: var(--muted); font-size: 12px; }

  .chk { border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.5; margin: 6px 0; }

  .chk.err { background: #fde8e8; color: #b42318; border: 2px solid #e5484d; }

  .addons { display: grid; gap: 8px; }

  .addon.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 8%, white); }
  .addon input { margin-top: 3px; }
  .addon small { display: block; color: var(--muted); }
  .builder .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .builder .chips button { border: 1px solid var(--line); background: var(--soft); border-radius: 99px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }

  .builder ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .builder li { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  .builder li b { flex: 1; }
  .builder li button { border: 0; background: var(--panel); border-radius: 6px; width: 26px; height: 24px; cursor: pointer; }
  .leg { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 12px; margin-left: 12px; border-left: 3px dotted var(--c); cursor: pointer; color: var(--muted); font-size: 13px; }
  .leg:hover .drive { background: var(--c); color: #fff; }

  .leg.active .drive { background: var(--c); color: #fff; }

  .veh { display: grid; gap: 8px; }
  .vcard { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .vcard .ico { font-size: 28px; }
  .vcard .vn { font-weight: 700; }
  .vcard .vd { color: var(--muted); font-size: 12px; }
  .vcard .vp { margin-left: auto; text-align: right; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .vcard .vp small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .vcard.on { border-color: var(--ink); box-shadow: 0 0 0 2px rgba(29,35,39,.15); }
  .row.picked { gap: 6px; font-size: 14px; }
  .row.picked b { font-size: 15px; }
  .row.picked small { flex-basis: 100%; color: var(--muted); font-size: 11px; margin-top: -6px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
  .step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .step button { border: 0; background: var(--soft); width: 32px; height: 32px; font-size: 18px; cursor: pointer; color: var(--ink); }
  .step span { min-width: 44px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .quote { margin-top: 12px; background: var(--soft); border-radius: 12px; padding: 12px 14px; }
  .quote .ln { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .quote .ln span:first-child { color: var(--muted); }
  .quote .tot { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: 17px; font-weight: 700; }
  .quote .tot span:first-child { color: var(--ink); }
  .fine { font-size: 11px; color: var(--muted); margin: 10px 0 0; }

  .inquiry { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .inquiry h2 { margin-bottom: 4px; }
  .inquiry form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .inquiry label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .inquiry label.full { grid-column: 1 / -1; }
  .inquiry input, .inquiry textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  .inquiry textarea { min-height: 64px; resize: vertical; }
  .inquiry button[type=submit] { grid-column: 1 / -1; border: 0; border-radius: 10px; padding: 11px; font: inherit; font-weight: 700; background: var(--c, var(--ink)); color: #fff; cursor: pointer; }
  .inquiry button[disabled] { opacity: .6; cursor: wait; }
  .qsum { margin-top: 10px; background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .qsum b { grid-column: 1 / -1; margin-bottom: 2px; }
  .qmsg { grid-column: 1 / -1; font-size: 13px; }
  .qmsg.ok { color: var(--ok); font-weight: 600; }
  .qmsg.err { color: var(--warn); }
  .captcha { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
  .captcha[hidden] { display: none; }
  .captcha .box { background: var(--panel); border-radius: 14px; padding: 18px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .captcha h3 { margin: 0 0 4px; font-size: 16px; }
  .captcha p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .captcha #hcap { display: flex; justify-content: center; min-height: 78px; }
  .captcha button { margin-top: 12px; border: 0; background: var(--soft); border-radius: 10px; padding: 8px 18px; font: inherit; cursor: pointer; }
  .wxtip { grid-column: 1 / -1; font-size: 12px; background: #fff7e6; color: #8a5a00; border-radius: 8px; padding: 8px 10px; }
  .fallback { grid-column: 1 / -1; display: grid; gap: 8px; }
  .fallback .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .fallback .btns a, .fallback .btns button { flex: 1; text-align: center; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 10px; padding: 9px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .fallback textarea { font-size: 12px; min-height: 120px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmp th, table.cmp td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* 讲解模式控制条 */
  .tour { position: absolute; z-index: 1000; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96); border-radius: 14px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .tour button { border: 0; background: var(--soft); border-radius: 10px; height: 38px; min-width: 38px; padding: 0 12px; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .tour button.play { background: var(--c, var(--ink)); color: #fff; }
  .tour .lbl { padding: 0 8px; font-size: 13px; min-width: 120px; text-align: center; font-weight: 600; }
  .mapwrap { position: relative; }

  .pin { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }

  .leaflet-tooltip.nametip { background: transparent; border: 0; box-shadow: none; font-weight: 700; font-size: 12px; color: #1d2327; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; padding: 0; }
  .leaflet-tooltip.nametip::before { display: none; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.5; min-width: 220px; }
  .pp h3 { margin: 0; font-size: 16px; }
  .pp .en { color: var(--muted); font-size: 12px; }

  .pp .meta { margin-top: 6px; font-weight: 600; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; height: 100dvh; }
    .mapwrap { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    header { padding: 14px 16px 6px; }
    .tabs, section { padding-left: 16px; padding-right: 16px; }
    .tabs { position: static; }

<div class="app">
  <aside id="side">
    <header>
      <h1>🇳🇿 新西兰南北岛包车之旅</h1>

</div>

<script>
// 页面版本（由 bump-version.sh 更新）。微信等浏览器会缓存旧页面，打开时和提交前都检查一次，过期就自动刷新
const PAGE_VERSION = '202610170217';
const latestVersion = () => fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()).then(d => d.v).catch(() => null);
function reloadTo(v) {
  try { if (sessionStorage.getItem('reloaded') === v) return false; sessionStorage.setItem('reloaded', v); } catch {}
  location.replace(location.pathname + '?v=' + v + location.hash);
  return true;
}
latestVersion().then(v => { if (v && v !== PAGE_VERSION) reloadTo(v); });

const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
// 价格区间 [低, 高]：住宿按常规–高端给出区间，总价也随之成为区间
const mr = ([a, b]) => a === b ? money(a) : `${money(a)}–${money(b)}`;
const radd = (...xs) => xs.reduce(([a, b], x) => Array.isArray(x) ? [a + x[0], b + x[1]] : [a + x, b + x], [0, 0]);
const rmul = ([a, b], k) => [a * k, b * k];
const hm = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${h} 小时${r ? ' ' + r + ' 分' : ''}` : `${r} 分钟`; };
const hmShort = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? String(r).padStart(2, '0') : ''}` : `${r}min`; };
const geo = (a, b) => GEO[[a, b].sort().join('-')];

const MAX_PEOPLE = 10;
// 日期：'YYYY-MM-DD' 按本地日期处理
const parseD = v => { if (!v) return null; const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d); };
const isoD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmtD = d => `${d.getMonth() + 1}月${d.getDate()}日（周${'日一二三四五六'[d.getDay()]}）`;
const cars = v => Math.ceil(state.people / v.pax);   // 单一车型：人数超过载客量时按多辆车计算

// 混搭车型：穷举各车型数量，找出能坐下所有人的每天最低总价（同价时车辆更少优先）
function cheapestFleet() {
  let best = null;
  const walk = (i, f) => {
    if (i === VEHICLES.length) {
      const pax = VEHICLES.reduce((n, v) => n + v.pax * f[v.id], 0);
      if (pax < state.people) return;
      const price = fleetPrice(f), count = Object.values(f).reduce((a, b) => a + b, 0);
      if (!best || price < best.price || (price === best.price && count < best.count)) best = { fleet: { ...f }, price, count };
      return;
    }
    const v = VEHICLES[i];
    for (let n = 0; n <= cars(v); n++) walk(i + 1, { ...f, [v.id]: n });
  };
  walk(0, {});
  return best.fleet;
}
const season = () => SEASON.months[state.month];
const seasonName = () => season().peak ? '旺季' : '淡季';
const stayRate = id => PLACES[id].stay.map(x => Math.round(x * (season().peak ? 1 : SEASON.offStayFactor)));
const vprice = v => v.price + (season().peak ? SEASON.peakCarAdd : SEASON.offCarAdd);
// 空驶段：起点或终点不是司导常驻城市时，各需空驶一段
const deadheadLegs = r => {
  if (r.noDeadhead || r.stops.length < 2 || PLACES[r.stops[0]].island === 'N') return [];
  const base = PLACES[DEADHEAD.base].name, start = r.stops[0], end = r.stops[r.stops.length - 1], legs = [];
  if (start !== DEADHEAD.base) legs.push(`${base} → ${PLACES[start].name}（空驶去起点）`);
  if (end !== DEADHEAD.base) legs.push(`${PLACES[end].name} → ${base}（空驶回${base}）`);
  return legs;
};
const fleetCount = f => Object.values(f).reduce((a, b) => a + b, 0);
const deadheadFee = (r, f) => deadheadLegs(r).length * fleetCount(f) * DEADHEAD.fee;
const fleetPrice = f => VEHICLES.reduce((s, v) => s + vprice(v) * (f[v.id] || 0), 0);
const fleetLabel = f => VEHICLES.filter(v => f[v.id]).map(v => `${v.name}${f[v.id] > 1 ? ` × ${f[v.id]} 辆` : ''}`).join(' + ');
const fleet = () => state.vehicle === 'auto' ? cheapestFleet() : { [state.vehicle]: cars(VEHICLES.find(v => v.id === state.vehicle)) };
const nightKey = (r, id) => r.id + ':' + id;
const state = { cart: { N: null, S: null }, preCar: {}, dates: {}, skip: {}, airport: {}, addons: {}, custom: { island: 'S', stops: [] }, nightSel: {}, month: new Date().getMonth() + 1, start: 'chc', route: 'central', people: 2, vehicle: 'auto', days: null, picks: {}, tourIdx: -1, playing: null };

// 按出发城市调整线路方向：单程线路反向，环线换起点；单独行程固定出发城市
function orient(r) {
  const start = r.fixed || state.start;
  if (r.stops[0] === start) return r;
  if (r.loop) {
    const m = r.stops.length - 1, k = r.stops.indexOf(start);
    if (k < 0 || k >= m) return r;
    const rot = a => a.slice(k).concat(a.slice(0, k));
    return { ...r, stops: [...rot(r.stops.slice(0, m)), start], nights: [...rot(r.nights.slice(0, m)), 0],
      legs: rot(r.legs), legNotes: rot(r.legNotes) };
  }
  if (r.stops[r.stops.length - 1] === start) {
    const rev = a => [...a].reverse();
    return { ...r, stops: rev(r.stops), nights: rev(r.nights), legs: rev(r.legs), legNotes: rev(r.legNotes) };
  }
  return r;
}
// 加选行程（米尔福德 / 凯库拉 / 阿卡罗阿）：插到线路第一次经过枢纽城市的位置
function withAddons(r) {
  if (r.type !== 'main') return r;
  const on = state.addons[r.id] || {};
  let x = { ...r, stops: [...r.stops], nights: [...r.nights], legs: [...r.legs], legNotes: [...r.legNotes], addonNames: [] };
  ADDONS.filter(a => on[a.id]).forEach(a => {
    const k = x.stops.indexOf(a.hub);
    if (k < 0) return;
    x.stops.splice(k + 1, 0, ...a.stops.slice(1));
    x.nights.splice(k + 1, 0, ...a.nights.slice(1));
    x.legs.splice(k, 0, ...a.legs);
    x.legNotes.splice(k, 0, ...a.legNotes);
    x.addonNames.push(a.name);
  });
  return x;
}

// 两地之间的车程：优先用经典线路里整理过的时间，其余按道路数据取整到 5 分钟
const LEG_TIME = {};
ROUTES.concat(ADDONS).forEach(r => r.legs.forEach((m, i) => { LEG_TIME[[r.stops[i], r.stops[i + 1]].sort().join('-')] = m; }));
const legTime = (a, b) => LEG_TIME[[a, b].sort().join('-')] ?? Math.max(5, Math.round((geo(a, b) || { osrmMin: 0 }).osrmMin / 5) * 5);

// 自由组合：客人按行程顺序点选地点
function customRoute() {
  const st = state.custom.stops.filter((id, i, a) => i === 0 || id !== a[i - 1]);
  const nights = st.map((id, i) => {
    if (st.indexOf(id) < i || PLACES[id].stay[1] === 0 || CUSTOM_PASS.includes(id)) return 0;
    const [lo, hi] = NIGHT_RANGE[id] || [0, 2];
    return Math.min(hi, Math.max(lo, 1));
  });
  return { id: 'custom', type: 'custom', stars: true, name: '自由组合', sub: '按顺序自选地点', color: '#0f766e',
    desc: '按您想走的顺序依次点选地点，系统自动计算每段车程、住宿和报价。',
    stops: st, nights, legs: st.slice(1).map((id, i) => legTime(st[i], id)), legNotes: st.slice(1).map(() => '') };
}
// 可选途经点（北岛套餐的霍比特村、怀托摩）：客人选择不去时从线路里去掉，相邻两站直接相连
function withSkips(r) {
  const skip = state.skip[r.id] || {};
  if (!r.optionalStops || !r.optionalStops.some(id => skip[id])) return r;
  const keep = r.stops.map((id, i) => !(r.optionalStops.includes(id) && skip[id]));
  const stops = r.stops.filter((_, i) => keep[i]), nights = r.nights.filter((_, i) => keep[i]);
  const legs = [], legNotes = [];
  for (let i = 0; i < stops.length - 1; i++) {
    const k = r.stops.findIndex((id, j) => id === stops[i] && r.stops[j + 1] === stops[i + 1]);
    legs.push(k >= 0 ? r.legs[k] : legTime(stops[i], stops[i + 1]));
    legNotes.push(k >= 0 ? r.legNotes[k] : '');
  }
  return { ...r, stops, nights, legs, legNotes };
}
const buildOR = () => { OR = [...ROUTES.map(r => withNights(withAddons(withSkips(orient(r))))), withNights(customRoute())]; };
// 自由组合里只途经、不住宿的地点
const CUSTOM_PASS = ['hob', 'wtm', 'mil'];
const nightRange = (r, id) => r.fixedNights ? null : r.type === 'custom' && CUSTOM_PASS.includes(id) ? null : NIGHT_RANGE[id] || (r.type === 'custom' && PLACES[id].stay[1] > 0 ? [0, 2] : null);

// 客人选择的住宿晚数（只对默认要住宿、且在 NIGHT_RANGE 里的地点生效）
function withNights(r) {
  // 南岛经典线路：起点城市不住，抵达当天接机后直接开往第二站，第一晚住第二站
  if (r.type === 'main') r = { ...r, nights: r.nights.map((n, i) => i === 0 ? 0 : n) };
  return { ...r, baseNights: r.nights, nights: r.nights.map((n, i) => {
    const sel = state.nightSel[nightKey(r, r.stops[i])];
    return n > 0 && nightRange(r, r.stops[i]) && sel != null ? sel : n;
  }) };
}
function changeNights(id, d) {
  const r = active(), [lo, hi] = nightRange(r, id), i = r.stops.findIndex((s, k) => s === id && r.baseNights[k] > 0);
  state.nightSel[nightKey(r, id)] = Math.min(hi, Math.max(lo, r.nights[i] + d));
  state.days = null;
  buildOR();
  const y = $('aside').scrollTop; render(); $('aside').scrollTop = y;
}
let OR = [];
const active = () => OR.find(r => r.id === state.route);
// 星空拍摄在住宿当晚进行，选择不住的地点不提供
const starsOnly = (r, id) => !!(r.starsOnly || PLACES[id].stars === 'starsOnly');
const starTitle = (r, id) => starsOnly(r, id) ? STAR_SERVICE.titleStars : STAR_SERVICE.title;
const hasStars = (r, id) => !!(r && r.stars && PLACES[id].stars && r.stops.some((s, i) => s === id && r.nights[i] > 0));
const fromTo = r => r.stops[0] === r.stops[r.stops.length - 1]
  ? `${PLACES[r.stops[0]].name}出发 · ${r.loop ? '环线' : '往返'}返回${PLACES[r.stops[0]].name}`
  : `${PLACES[r.stops[0]].name} → ${PLACES[r.stops[r.stops.length - 1]].name}`;

// 包车天数：抵达起点城市当天只提供接机（当天或前一天），不算包车日
// 包车天数：在机场城市（奥克兰 / 基督城 / 皇后镇）开始并住宿时，抵达当天只接机；
// 在机场城市结束并住宿时，离开当天只送机；这两天都不算包车日
const atAirport = id => id in AIRPORT.fee;
const arrivalFree = r => r.stops.length > 1 && atAirport(r.stops[0]) && r.nights[0] > 0;
const departFree = r => r.stops.length > 1 && atAirport(r.stops[r.stops.length - 1]) && r.nights[r.nights.length - 1] > 0;
const freeDayNote = r => [arrivalFree(r) && `抵达${PLACES[r.stops[0]].name}当天只接机`, departFree(r) && `离开${PLACES[r.stops[r.stops.length - 1]].name}当天只送机`].filter(Boolean).join('、');
const charterDays = (r, s = routeStats(r)) => Math.max(1, s.days - (arrivalFree(r) ? 1 : 0) - (departFree(r) ? 1 : 0));

function routeStats(r) {
  const km = r.legs.reduce((s, _, i) => s + (geo(r.stops[i], r.stops[i + 1]) || { km: 0 }).km, 0);
  const drive = r.legs.reduce((a, b) => a + b, 0);
  const nights = r.nights.reduce((a, b) => a + b, 0);
  const stay = r.stops.reduce((s, id, i) => radd(s, rmul(stayRate(id), r.nights[i])), [0, 0]);
  return { km, drive, nights, days: nights + 1, stay };
}

/* ---------- 地图 ---------- */
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([-44.0, 170.3], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const toggleCrowded = () => map.getContainer().classList.toggle('crowded', map.getZoom() < 8 && map.getSize().x < 600);
map.on('zoomend resize', toggleCrowded);

const routeLayers = {};   // id -> { lines: [polyline per leg], group }
let activeLayer = L.layerGroup().addTo(map);
let highlight = null;

function buildLayers() {
  buildOR();
  Object.values(routeLayers).forEach(l => map.removeLayer(l.group));
  OR.forEach(r => {
    const group = L.layerGroup().addTo(map);
    const lines = r.legs.map((_, i) => {
      const a = r.stops[i], b = r.stops[i + 1];
      let path = (geo(a, b) || { path: [[PLACES[a].lat, PLACES[a].lng], [PLACES[b].lat, PLACES[b].lng]] }).path;
      if ([a, b].sort()[0] !== a) path = path.slice().reverse();
      return L.polyline(path, { color: r.color, weight: 4, opacity: .9 }).addTo(group)
        .on('click', () => { if (state.route !== r.id) setRoute(r.id); focusLeg(i); });
    });
    routeLayers[r.id] = { lines, group };
  });
}

function popupHtml(id, r) {
  const p = PLACES[id];
  const idx = r ? r.stops.map((s, i) => s === id ? i : -1).filter(i => i >= 0) : [];
  const n = idx.reduce((s, i) => s + r.nights[i], 0);
  const top = p.acts.slice(0, 3).map(a => `<li>${a.n} · ${a.p ? money(a.p) : '免费'} · ${a.d}</li>`).join('');
  return `<div class="pp"><h3>${p.name}</h3><div class="en">${p.en}</div>
    <div style="margin-top:6px">${p.intro}</div>
    <div class="meta">${n ? `住 ${n} 晚 · 约 ${mr(stayRate(id))}/人/晚` : '途经 / 一日游，不住宿'}</div>
    <ul>${top}</ul>
    ${hasStars(r, id) ? `<div class="starbox">✨ <b>${starTitle(r, id)}</b><span class="warn">${starsOnly(r, id) ? STAR_SERVICE.disclaimerStars : STAR_SERVICE.disclaimer}</span></div>` : ''}</div>`;
}

function drawActive() {
  activeLayer.clearLayers();
  const showAll = state.route === 'all';
  OR.forEach(r => {
    const on = (showAll && r.type !== 'custom') || r.id === state.route;
    routeLayers[r.id].lines.forEach(l => l.setStyle({ weight: on ? 5 : 3, opacity: on ? .95 : .18, dashArray: on ? null : '4 6' }));
    if (on) routeLayers[r.id].group.eachLayer(l => l.bringToFront());
  });
  const routes = showAll ? OR.filter(r => r.type !== 'custom') : [active()];
  const seen = {};
  routes.forEach(r => {
    // 站点编号（同一地点出现多次时合并编号）
    const nums = {};
    r.stops.forEach((id, i) => (nums[id] = nums[id] || []).push(i + 1));
    Object.entries(nums).forEach(([id, ns]) => {
      if (showAll && seen[id]) return;
      seen[id] = 1;
      const p = PLACES[id];
      const label = showAll ? '' : ns.join('·');
      const icon = L.divIcon({ className: '', iconSize: showAll ? [14, 14] : [30, 30], iconAnchor: showAll ? [7, 7] : [15, 15],
        html: `<div class="pin ${showAll ? 'small' : ''}" style="background:${r.color}">${label}</div>` });
      L.marker([p.lat, p.lng], { icon, riseOnHover: true }).addTo(activeLayer)
        .bindTooltip(p.name + (hasStars(showAll ? null : r, id) ? ' ✨' : ''), { permanent: true, direction: 'right', offset: [showAll ? 8 : 14, 0], className: 'nametip' })
        .bindPopup(popupHtml(id, showAll ? null : r))
        .on('click', () => { if (!showAll) markStop(r.stops.indexOf(id)); });
    });
    if (!showAll) {
      r.legs.forEach((m, i) => {
        const path = (geo(r.stops[i], r.stops[i + 1]) || { path: [[PLACES[r.stops[i]].lat, PLACES[r.stops[i]].lng]] }).path;
        const mid = path[Math.floor(path.length / 2)];
        L.tooltip({ permanent: true, direction: 'center', className: 'legtip' }).setLatLng(mid).setContent('🚗 ' + hmShort(m)).addTo(activeLayer);
      });
    }
  });
  const pts = routes.flatMap(r => r.stops.map(id => [PLACES[id].lat, PLACES[id].lng]));
  if (pts.length > 1) map.flyToBounds(L.latLngBounds(pts).pad(.12), { duration: .8 });
  else if (pts.length === 1) map.flyTo(pts[0], 8, { duration: .8 });
  else map.flyTo(state.custom.island === 'N' ? [-38, 175.7] : [-44, 170.3], 7, { duration: .8 });
}

function focusLeg(i) {
  const r = active();
  if (highlight) map.removeLayer(highlight);
  const line = routeLayers[r.id].lines[i];
  highlight = L.polyline(line.getLatLngs(), { color: '#111', weight: 9, opacity: .25 }).addTo(map);
  line.bringToFront();
  map.flyToBounds(line.getBounds().pad(.25), { duration: .8 });
  document.querySelectorAll('.leg, .stop').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`.leg[data-i="${i}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function markStop(i) {
  document.querySelectorAll('.leg, .stop').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`.stop[data-i="${i}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function focusStop(i, zoom = 10) {
  const r = active();
  const id = r.stops[i], p = PLACES[id];
  if (highlight) { map.removeLayer(highlight); highlight = null; }
  if (i > 0) {
    const line = routeLayers[r.id].lines[i - 1];
    highlight = L.polyline(line.getLatLngs(), { color: '#111', weight: 9, opacity: .25 }).addTo(map);
    line.bringToFront();
  }
  map.flyTo([p.lat, p.lng], zoom, { duration: 1.2 });
  L.popup({ offset: [0, -12] }).setLatLng([p.lat, p.lng]).setContent(popupHtml(id, r)).openOn(map);
  markStop(i);
}

/* ---------- 侧边栏 ---------- */

    <div class="start">${startHtml}<span class="season"><b style="background:${season().peak ? '#e2780e' : '#1a9c6b'}">${state.month}月·${seasonName()}</b>${season().why}${season().peak ? '' : `，住宿约 ${Math.round(SEASON.offStayFactor * 100) / 10} 折`}</span></div>
    <div class="start">月份 <span class="seg mon">${Object.keys(SEASON.months).map(m => `<button class="${+m === state.month ? 'on' : ''} ${SEASON.months[m].peak ? 'peak' : ''}" data-mon="${m}" title="${m}月 · ${SEASON.months[m].peak ? '旺季' : '淡季'}：${SEASON.months[m].why}">${m}</button>`).join('')}</span></div>

function vehicleHtml(days, preDays = 0) {
  return `<section>

// 人机验证（hCaptcha）：弹窗放在表单外面，不会因为页面重新渲染而消失；验证通过后返回 token
let capWidget = null;
function getCaptchaToken() {
  return new Promise((resolve, reject) => {
    if (!window.hcaptcha) return reject(new Error('人机验证加载失败，请检查网络后重试'));
    const box = $('#captcha');
    box.hidden = false;
    const done = token => { box.hidden = true; resolve(token); };
    $('#capCancel').onclick = () => { box.hidden = true; reject(new Error('已取消人机验证')); };
    if (capWidget === null) capWidget = hcaptcha.render('hcap', { sitekey: QUOTE_FORM.hcaptchaSitekey, callback: t => capDone(t) });
    else hcaptcha.reset(capWidget);
    window.capDone = done;
  });
}
const capDone = t => window.capDone && window.capDone(t);

async function postJSON(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) });
  return { res, data: await res.json().catch(() => ({})) };
}
async function sendWeb3Forms(body) {
  const { res, data } = await postJSON('https://api.web3forms.com/submit', body);
  if (!res.ok || !data.success) throw new Error(data.message || res.status);
}
async function sendFormSubmit(body) {
  const { res, data } = await postJSON(`https://formsubmit.co/ajax/${QUOTE_FORM.formsubmitId || QUOTE_FORM.fallbackEmail.join('@')}`, body);
  if (!res.ok || String(data.success) !== 'true') throw new Error(data.message || res.status);
}

function bindInquiry() {
  const form = $('#qform');
  if (!form) return;
  form.oninput = e => { if (FORM_FIELDS.some(f => f.k === e.target.name)) state.form[e.target.name] = e.target.value; };
  form.onsubmit = async e => {
    e.preventDefault();
    const v = await latestVersion();
    if (v && v !== PAGE_VERSION && reloadTo(v)) { $('#qmsg').className = 'qmsg err'; $('#qmsg').textContent = '页面有更新，正在刷新，请刷新后重新提交。'; return; }
    const msg = $('#qmsg'), btn = form.querySelector('button[type=submit]');
    const f = state.form;
    if (!(f.name || '').trim() || !(f.contact || '').trim()) { msg.className = 'qmsg err'; msg.textContent = '请填写姓名和微信号 / 电话。'; return; }
    if (!QUOTE_FORM.accessKey) { msg.className = 'qmsg err'; msg.textContent = '报价系统尚未配置，请直接联系我们。'; return; }
    btn.disabled = true; btn.textContent = '提交中…'; msg.textContent = ''; $('#qfallback').hidden = true;
    const subject = `${QUOTE_FORM.subject}｜${f.name}｜${state.quote['线路']}｜${state.month}月｜${state.quote['出行人数']}`;
    const fields = {
      '客人姓名': f.name, '微信/电话': f.contact, '客人邮箱': f.email || '未填写', '其他需求': f.note || '无',
      ...state.quote,
    };
    const errors = [];
    try {
      // 通道 1：Web3Forms（需要人机验证）
      try {
        btn.textContent = '等待人机验证…';
        const token = await getCaptchaToken();
        btn.textContent = '提交中…';
        await sendWeb3Forms({ 'h-captcha-response': token, access_key: QUOTE_FORM.accessKey, subject, from_name: '南岛包车报价页面',
          botcheck: form.botcheck.checked, ...(f.email ? { replyto: f.email } : {}), ...fields });
      } catch (err) {
        if (err.message === '已取消人机验证') throw err;
        errors.push('通道1：' + err.message);
        // 通道 2：FormSubmit（Web3Forms 拦截某些网络 / 微信浏览器时自动改用）
        btn.textContent = '换备用通道提交中…';
        await sendFormSubmit({ _subject: subject, _template: 'table', _captcha: 'false', ...(f.email ? { _replyto: f.email } : {}), ...fields });
      }
      msg.className = 'qmsg ok'; msg.textContent = '✅ 已收到您的报价咨询，我们会尽快与您联系！';
      state.form = {}; FORM_FIELDS.forEach(x => { form[x.k].value = ''; });
    } catch (err) {
      if (err.message === '已取消人机验证') { msg.className = 'qmsg'; msg.textContent = '已取消提交。'; return; }
      if (errors.length && !errors.includes(err.message)) errors.push('通道2：' + err.message);
      msg.className = 'qmsg err';
      msg.textContent = '提交没有成功（' + (errors.join('；') || err.message) + '）。您可以：① 点右上角「···」选「在浏览器中打开」后重试；② 用下面的方式把报价内容发给我们。';
      showFallback(f);
    } finally {
      btn.disabled = false; btn.textContent = '提交报价咨询';
    }
  };
}

function airportLegs(r, days, fl) {
  const sel = state.airport[r.id] || {}, n = fleetCount(fl), free = days >= AIRPORT.minDays, out = [];
  [['pickup', '接机', r.stops[0], '抵达当天或前一天'], ['dropoff', '送机', r.stops[r.stops.length - 1], '离开当天']].forEach(([k, label, city, when]) => {
    if (!(city in AIRPORT.fee)) return;
    out.push({ k, label, city, when, on: !!sel[k], fee: free ? 0 : AIRPORT.fee[city] * n, unit: AIRPORT.fee[city] });
  });
  return out;
}
// 每条线路各自的日期（南北岛组合时两段分别填写）
const dts = r => state.dates[r.id] = state.dates[r.id] || { arrive: '', start: '' };
// 按这条线路的出发日期所在月份计算淡旺季价格
function withMonth(r, fn) {
  const d = dts(r).start || dts(r).arrive;
  if (!d) return fn();
  const keep = state.month; state.month = parseD(d).getMonth() + 1;
  try { return fn(); } finally { state.month = keep; }
}
function tripDates(r) {
  const arrive = parseD(dts(r).arrive), start = parseD(dts(r).start) || arrive;
  if (!start) return null;
  const nights = r.nights.reduce((a, b) => a + b, 0);
  // 每站的到达日期：包车出发日 + 之前累计的晚数
  let acc = 0;
  const stopDates = r.stops.map((_, i) => { const d = addD(start, acc); acc += r.nights[i]; return d; });
  const arr = arrive || start, gap = Math.max(0, Math.round((start - arr) / 864e5));
  // gap = 抵达到包车出发之间住在起点城市的晚数；中间的整天（gap − 1）可选市内用车
  return { arrive: arr, start, leave: addD(start, nights), stopDates, gap, carDays: Math.max(0, gap - 1) };
}
// 抵达后、包车出发前：起点城市住宿（按人数计入报价）+ 可选市内用车
function preTrip(r, td, fl) {
  if (!td || !td.gap) return null;
  const id = r.stops[0], carOn = !!state.preCar[r.id] && td.carDays > 0;
  return { id, name: PLACES[id].name, nights: td.gap, rate: stayRate(id), stay: rmul(stayRate(id), td.gap * state.people),
    carDays: td.carDays, carOn, car: carOn ? fleetPrice(fl) * td.carDays : 0, perDay: fleetPrice(fl) };
}

  });
}

// 计算一条线路的完整报价（南北岛组合时也会分别调用）
function quoteFor(r) {
  return withMonth(r, () => {
    const s = routeStats(r);
    const days = state.days ?? charterDays(r, s);
    const td = tripDates(r);
    // 北岛套餐默认含霍比特村导览、萤火虫洞门票；选择不去该途经点时自动不计
    const picks = state.picks[r.id] = state.picks[r.id] || Object.fromEntries((r.optionalStops || []).map(id => [id + ':0', true]));

    const picked = Object.keys(picks).filter(k => picks[k] && r.stops.includes(k.split(':')[0]));
    const actPP = picked.reduce((sum, k) => {
      const [id, idx] = k.split(':'); return sum + PLACES[id].acts[idx].p;
    }, 0);
    const fl = fleet(), car = fleetPrice(fl) * days, stay = rmul(s.stay, state.people), act = actPP * state.people;
    const dhLegs = deadheadLegs(r), dh = deadheadFee(r, fl);
    const air = airportLegs(r, days, fl), airOn = air.filter(a => a.on), airFee = airOn.reduce((x, a) => x + a.fee, 0);
    const pre = preTrip(r, td, fl);
    const total = radd(car, dh, airFee, stay, act, pre ? pre.stay : 0, pre ? pre.car : 0);

    const starStops = r.stops.filter((id, i, a) => a.indexOf(id) === i && hasStars(r, id));
    const starNights = r.stops.reduce((n, id, i) => n + (hasStars(r, id) ? r.nights[i] : 0), 0);
    const allStarsOnly = starStops.length && starStops.every(id => starsOnly(r, id));
    const onlyList = starStops.filter(id => starsOnly(r, id));
    const svcName = allStarsOnly ? '星空拍摄' : '星空/极光拍摄';
    const banner = starStops.length ? `<div class="starbanner"><h3>✨ ${allStarsOnly ? STAR_SERVICE.titleStars : STAR_SERVICE.title} · 免费赠送</h3>
      <p>可拍摄地点：${starStops.map(id => PLACES[id].name + (!allStarsOnly && starsOnly(r, id) ? '（仅星空）' : '')).join('、')}</p>
      <p>${allStarsOnly ? STAR_SERVICE.detailStars : STAR_SERVICE.detail}</p>
      <p class="warn">⚠️ 声明：${allStarsOnly ? STAR_SERVICE.disclaimerStars : STAR_SERVICE.disclaimer}</p></div>` : '';
    // 记下当前报价，供提交表单时发送
    const actList = picked.map(k => { const [id, idx] = k.split(':'); const a = PLACES[id].acts[idx]; return `${PLACES[id].name}｜${a.n}｜${a.p ? money(a.p) + '/人' : '免费'}`; });
    const fields = {
      '线路': `${r.name} · ${r.sub}${r.addonNames && r.addonNames.length ? ' + ' + r.addonNames.join(' + ') : ''}`,
      '加选行程': r.addonNames && r.addonNames.length ? r.addonNames.join('、') : '无',
      '路线': r.stops.map(id => PLACES[id].name).join(' → '),
      '住宿安排': (pre ? `${pre.name}（抵达后）：${pre.nights} 晚（${mr(pre.rate)}/人/晚）\n` : '') + stayPlan(r).map(x => `${x.name}：${x.n ? `${x.n} 晚（${mr(x.rate)}/人/晚）` : '不住'}`).join('\n'),
      '抵达日期': td ? `${fmtD(td.arrive)}（${PLACES[r.stops[0]].name}）` : '未填写',
      '包车出发日期': td ? fmtD(td.start) : '未填写',
      '离开日期': td ? `${fmtD(td.leave)}（${PLACES[r.stops[r.stops.length - 1]].name}）` : '未填写',
      '出行月份': `${state.month} 月（${seasonName()}：${season().why}）`,
      '出行人数': `${state.people} 人`,
      '包车天数': `${days} 天（行程 ${s.days}天${s.nights}晚${freeDayNote(r) ? `，${freeDayNote(r)}，不算包车日` : ''}）`,
      '包车车辆': `${fleetLabel(fl)}（${money(fleetPrice(fl))}/天）`,
      '已选活动': actList.length ? actList.join('\n') : '未选择',
      '包车费': money(car),
      '空驶费': dh ? `${money(dh)}（${dhLegs.join('；')}，${fleetCount(fl)} 辆车）` : (PLACES[r.stops[0]].island === 'N' ? '无（北岛行程）' : '无（基督城出发并返回）'),
      '接送机': airOn.length ? airOn.map(a => `${a.label}（${PLACES[a.city].name}机场）：${a.fee ? money(a.fee) : '免费'}`).join('；') : '不需要',
      '抵达后住宿': pre ? `${pre.name} ${pre.nights} 晚（${mr(pre.rate)}/人/晚）× ${state.people} 人 = ${mr(pre.stay)}` : '无',
      '包车出发前用车': pre && pre.carDays ? (pre.carOn ? `${pre.name} ${pre.carDays} 天 = ${money(pre.car)}` : '不需要') : '无',
      '住宿费': `${mr(stay)}（${s.nights} 晚 × ${state.people} 人，常规–高端）`,
      '活动费': `${money(act)}（${money(actPP)}/人）`,
      '合计 (NZD)': mr(total),
      '人均 (NZD)': mr(rmul(total, 1 / state.people)),
      [svcName]: starStops.length ? `免费，可拍摄地点：${starStops.map(id => PLACES[id].name + (!allStarsOnly && starsOnly(r, id) ? '（仅星空）' : '')).join('、')}；视天气不保证` : '无',
    };

    return { s, days, td, picks, picked, actPP, fl, car, stay, act, dhLegs, dh, air, airOn, airFee, pre, total,
      starStops, starNights, allStarsOnly, svcName, banner, fields, month: state.month, seasonName: seasonName(), peak: season().peak };
  });
}

function renderRoute(r) {
  if (r.type === 'custom' && r.stops.length < 2) {
    $('#content').innerHTML = `<section><h2 style="color:${r.color}">${r.name} · ${r.sub}</h2><p class="desc">${r.desc}</p></section>${builderHtml(r)}`;
    bindBuilder();
    return;
  }
  const q = quoteFor(r);
  const cd = cartData();
  const { s, days, td, picks, picked, actPP, fl, car, stay, act, dhLegs, dh, air, airOn, airFee, pre, total, starStops, starNights, allStarsOnly, svcName, banner } = q;
  let tl = '';
  r.stops.forEach((id, i) => {
    const p = PLACES[id], n = r.nights[i];
    const repeat = r.stops.indexOf(id) < i;
    tl += `<div class="stop" data-i="${i}" style="--c:${r.color}">
      <div class="stop-h"><div class="num">${i + 1}</div>

        <div class="tag">${r.baseNights[i] && nightRange(r, id) ? (n === 0
          ? `<span class="pill">不住 <span class="nstep"><button data-nid="${id}" data-dn="1">+</button></span></span><span class="nrange">可选 ${nightRange(r, id)[0]}–${nightRange(r, id)[1]} 晚，0 = 不住宿</span>`
          : `<span class="pill stay">住 <span class="nstep"><button data-nid="${id}" data-dn="-1" ${n <= nightRange(r, id)[0] ? 'disabled' : ''}>−</button> ${n} <button data-nid="${id}" data-dn="1" ${n >= nightRange(r, id)[1] ? 'disabled' : ''}>+</button></span> 晚 · ${mr(stayRate(id))}/人/晚</span><span class="nrange">可选 ${nightRange(r, id)[0]}–${nightRange(r, id)[1]} 晚</span>`
) : n ? `<span class="pill stay">住 ${n} 晚 · ${mr(stayRate(id))}/人/晚</span>`
          : `<span class="pill">${i === 0 ? '出发' : i === r.stops.length - 1 ? '终点' : '途经'}</span>`}</div>
      </div>
      ${repeat ? `<div class="intro">再次回到${p.name}${n ? '过夜' : ''}，活动见第 ${r.stops.indexOf(id) + 1} 站。</div>` : `
      <div class="intro">${p.intro}</div>
      ${hasStars(r, id) ? `<div class="starbox">✨ <b>${starTitle(r, id)}</b>（免费）<span class="warn">不保证，视当晚天气状况而定</span></div>` : ''}
      <table class="acts">${p.acts.map((a, k) => {
        const key = id + ':' + k;
        return `<tr><td class="ck"><input type="checkbox" data-k="${key}" ${picks[key] ? 'checked' : ''} title="加入报价"></td>
          <td>${a.n}<span class="t">${a.t}</span></td><td class="d">⏱ ${a.d}</td>
          <td class="p ${a.p ? '' : 'free'}">${a.p ? money(a.p) : '免费'}</td></tr>`;
      }).join('')}</table>`}
    </div>`;
    if (i < r.legs.length) {
      const g = geo(id, r.stops[i + 1]) || { km: '—' };
      tl += `<div class="leg" data-i="${i}" style="--c:${r.color}"><span class="drive">🚗 ${hm(r.legs[i])}</span><span>${g.km} km${r.legNotes[i] ? ' · ' + r.legNotes[i] : ''}</span></div>`;
    }
  });

  $('#content').innerHTML = `
    <section>
      <h2 style="color:${r.color}">${r.name} · ${r.sub}</h2>
      <p style="margin:-4px 0 8px;font-weight:600">${fromTo(r)}</p>
      <p class="desc">${r.desc}</p>
      <div class="stats">
        <div class="stat"><div class="v">${s.days}天${s.nights}晚</div><div class="k">建议行程</div></div>
        <div class="stat"><div class="v">${s.km.toLocaleString()}</div><div class="k">总里程 km</div></div>
        <div class="stat"><div class="v">${Math.round(s.drive / 6) / 10}h</div><div class="k">纯驾车时长</div></div>
        <div class="stat"><div class="v" style="font-size:15px">${mr(s.stay)}</div><div class="k">每人住宿合计（常规–高端）</div></div>
      </div>
      ${banner}
    </section>
    ${r.type === 'custom' ? builderHtml(r) : addonHtml(r)}${optionalHtml(r)}
    <section><h2>📍 途经地与每段车程</h2><p class="fine" style="margin:-4px 0 10px">勾选活动可加入下方报价 · 点击站点或车程在地图上定位</p><div class="timeline">${tl}</div></section>
    ${datesHtml(r, td, pre)}
    ${airportHtml(r, air, days)}
    ${vehicleHtml(days, pre && pre.carOn ? pre.carDays : 0)}
    <section style="border-bottom:0">
      <div class="quote">
        <div class="ln"><span>包车 ${fleetLabel(fl)} × ${days} 天${freeDayNote(r) ? `<br><small>${freeDayNote(r)}，不算包车日</small>` : ''}</span><span>${money(car)}</span></div>
        ${dh ? `<div class="ln"><span>司导及车辆空驶费 ${dhLegs.length} 段 × ${fleetCount(fl)} 辆 × ${money(DEADHEAD.fee)}<br><small>${dhLegs.join('；')}</small></span><span>${money(dh)}</span></div>` : ''}
        ${airOn.map(a => `<div class="ln"><span>${a.label}（${PLACES[a.city].name}机场）${a.fee ? '' : ` · 包车满 ${AIRPORT.minDays} 天`}</span><span>${a.fee ? money(a.fee) : '免费'}</span></div>`).join('')}
        ${pre ? `<div class="ln"><span>抵达后住宿（${pre.name}）${pre.nights} 晚 × ${state.people} 人（常规–高端）</span><span>${mr(pre.stay)}</span></div>` : ''}
        ${pre && pre.carOn ? `<div class="ln"><span>包车出发前在${pre.name}用车 ${pre.carDays} 天</span><span>${money(pre.car)}</span></div>` : ''}
        <div class="ln"><span>住宿 ${s.nights} 晚 × ${state.people} 人（常规–高端）</span><span>${mr(stay)}</span></div>
        <div class="ln"><span>已选活动 ${money(actPP)}/人 × ${state.people} 人</span><span>${money(act)}</span></div>
        ${starNights ? `<div class="ln"><span>✨ ${svcName}（最多 ${starNights} 晚，视天气）</span><span>免费</span></div>` : ''}
        <div class="ln tot"><span>合计（NZD）</span><span>${mr(total)}</span></div>
        <div class="ln"><span>人均</span><span>${mr(rmul(total, 1 / state.people))}</span></div>
      </div>
      <p class="fine">* 所有价格为新西兰元 (NZD) ${state.month} 月${seasonName()}参考价${season().peak ? '' : `（淡季住宿按 ${Math.round(SEASON.offStayFactor * 100) / 10} 折计算）`}，住宿按两人一间均摊，给出常规（3–4 星）到高端（精品/豪华）的价格区间，因此总价为区间；活动价格以各运营商官网为准；餐饮、机票、保险未计入。${starNights ? `${svcName}为免费赠送服务，不作保证，视天气状况而定。` : ''}</p>
      ${addBtnHtml(r)}
      ${cartHtml(cd)}
      ${inquiryHtml(r, pre, cd.segs.length ? cd.segs.map((x, i) => staySumHtml(x, cd.qs[i].pre, cd.segs.length > 1 ? ISL[islandOf(x)] + ' · ' : '')).join('') : undefined)}
    </section>`;

  state.quote = cd.segs.length ? cartFields(cd) : q.fields;
  bindCart();

  bindInquiry();
  bindBuilder();
  document.querySelectorAll('[data-nid]').forEach(b => b.onclick = ev => { ev.stopPropagation(); changeNights(b.dataset.nid, +b.dataset.dn); });
  document.querySelectorAll('.stop').forEach(e => e.onclick = ev => { if (!['INPUT', 'BUTTON'].includes(ev.target.tagName)) { stopTour(); state.tourIdx = +e.dataset.i; focusStop(+e.dataset.i); updateTourLbl(); } });
  document.querySelectorAll('.leg').forEach(e => e.onclick = () => { stopTour(); focusLeg(+e.dataset.i); });
  document.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { picks[c.dataset.k] = c.checked; const y = $('aside').scrollTop; render(); $('aside').scrollTop = y; });
  bindVehicle();
}

/* ---------- 已选行程：北岛、南岛各选一条，合并报价 ---------- */
const islandOf = r => PLACES[r.stops[0]] && PLACES[r.stops[0]].island === 'N' ? 'N' : 'S';
const ISL = { N: '北岛', S: '南岛' };
const segName = r => `${r.name.replace(/^北岛 · /, '')}${r.type === 'custom' ? '' : ' · ' + r.sub.split(' · ')[0]}`;
const cartRoutes = () => ['N', 'S'].map(k => state.cart[k] && OR.find(r => r.id === state.cart[k])).filter(r => r && r.stops.length > 1);
function addBtnHtml(r) {
  const k = islandOf(r), mine = state.cart[k] === r.id, other = state.cart[k] && !mine && OR.find(x => x.id === state.cart[k]);
  return `<div class="cartbtn" style="--c:${r.color}">${mine
    ? `<button class="added" data-cart-rm="${k}">✓ 已加入报价（${ISL[k]}）· 点击取消</button>`
    : `<button data-cart-add="${r.id}">＋ 加入报价（${ISL[k]}）${other ? `<small>将替换已选的「${segName(other)}」</small>` : ''}</button>`}</div>`;
}
// 两段日期检查：比较先出发那段的离开日和后一段的抵达日
function cartCheck(segs) {
  if (segs.length < 2) return null;
  const tds = segs.map(r => tripDates(r));
  if (tds.some(t => !t)) return { level: 'info', msg: `请在${segs.filter((r, i) => !tds[i]).map(r => `「${r.name}」`).join('和')}里填写行程日期，系统会检查两段日期是否衔接。` };
  const [i, j] = tds[0].arrive <= tds[1].arrive ? [0, 1] : [1, 0];
  const A = segs[i], B = segs[j], ta = tds[i], tb = tds[j];
  const lv = `${ISL[islandOf(A)]} ${fmtD(ta.leave)} 离开${PLACES[A.stops[A.stops.length - 1]].name}`, ar = `${ISL[islandOf(B)]} ${fmtD(tb.arrive)} 抵达${PLACES[B.stops[0]].name}`;
  const gap = Math.round((tb.arrive - ta.leave) / 864e5);
  if (gap < 0) return { level: 'err', msg: `日期重叠 ${-gap} 天：${lv}，但${ar}，两段行程撞期。请把${ISL[islandOf(B)]}的抵达日期改到 ${fmtD(ta.leave)} 或之后，或减少${ISL[islandOf(A)]}的住宿晚数。` };
  if (gap === 0) return { level: 'ok', msg: `日期衔接：${lv}，当天${ar}（跨岛航班机票不含在报价内）。` };
  return { level: 'warn', msg: `中间多出 ${gap} 天未安排：${lv}，${ar}，中间 ${gap} 晚没有住宿和行程。请调整日期或增加住宿晚数。` };
}
function cartData() {
  const segs = cartRoutes();
  const qs = segs.map(r => quoteFor(r));
  return { segs, qs, chk: cartCheck(segs), total: radd(...qs.map(q => q.total)) };
}
const resetBtns = `<div class="resets"><button data-reset="N">↺ 重置北岛</button><button data-reset="S">↺ 重置南岛</button></div>`;
// 重置某个岛：清掉已选行程，以及该岛所有线路上调整过的晚数、活动、加选、途经点、接送机、日期
function resetIsland(k) {
  const ids = OR.filter(r => r.type === 'custom' ? state.custom.island === k : islandOf(r) === k).map(r => r.id);
  state.cart[k] = null;
  ids.forEach(id => { ['picks', 'addons', 'skip', 'airport', 'dates', 'preCar'].forEach(f => delete state[f][id]); });
  Object.keys(state.nightSel).forEach(key => { if (ids.includes(key.split(':')[0])) delete state.nightSel[key]; });
  if (state.custom.island === k) state.custom.stops = [];
  state.days = null;
  buildLayers();
}
function cartHtml(cd) {
  const { segs, qs, chk, total } = cd;
  if (!segs.length) return `<div class="cart empty">🧾 <b>已选行程</b>：还没有加入任何行程。在北岛或南岛线路里调整好后，点「＋ 加入报价」，可北岛、南岛各选一条合并报价。${resetBtns}</div>`;
  return `<div class="cart"><h3>🧾 已选行程（${segs.length} 段）</h3>${resetBtns}
    ${segs.map((r, i) => { const q = qs[i], td = q.td; return `<div class="citem" style="--c:${r.color}">
      <div><b>✓ ${ISL[islandOf(r)]} · ${segName(r)}</b>${r.addonNames && r.addonNames.length ? ` + ${r.addonNames.join(' + ')}` : ''}
        <small>${q.s.days}天${q.s.nights}晚${q.pre ? ` + 抵达后住 ${q.pre.nights} 晚` : ''} · ${td ? `${fmtD(td.arrive)} 抵达 – ${fmtD(td.leave)} 离开` : '未填日期'} · ${q.month}月${q.seasonName}</small>
        <span class="cact"><a href="#" data-goto="${r.id}">查看 / 修改</a> · <a href="#" data-cart-rm="${islandOf(r)}">移除</a></span></div>
      <span class="camt">${mr(q.total)}</span></div>`; }).join('')}
    ${chk ? `<div class="chk ${chk.level}">${{ ok: '✅', warn: '⚠️', err: '⛔', info: '📅' }[chk.level]} ${chk.msg}</div>` : `<p class="fine" style="margin:6px 0">可再加入${ISL[segs[0] && islandOf(segs[0]) === 'N' ? 'S' : 'N']}行程，合并成一份报价。</p>`}
    <div class="ln tot"><span>${segs.length > 1 ? '两段合计' : '合计'}（NZD）</span><span>${mr(total)}</span></div>
    <div class="ln"><span>人均</span><span>${mr(rmul(total, 1 / state.people))}</span></div>
  </div>`;
}
function cartFields(cd) {
  const { segs, qs, chk, total } = cd;
  if (segs.length === 1) return qs[0].fields;
  const pref = (tag, f) => Object.fromEntries(Object.entries(f).map(([k, v]) => [`${tag}${k}`, v]));
  return {
    '线路': segs.map(r => `${ISL[islandOf(r)]}：${segName(r)}`).join(' + '),
    '出行人数': `${state.people} 人`,
    '日期检查': chk ? chk.msg : '—',
    ...Object.assign({}, ...segs.map((r, i) => pref(`【${ISL[islandOf(r)]}】`, qs[i].fields))),
    '合计 (NZD)': mr(total),
    '人均 (NZD)': mr(rmul(total, 1 / state.people)),
  };
}
function bindCart() {
  const redo = () => { const y = $('aside').scrollTop; render(); $('aside').scrollTop = y; };
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    const k = b.dataset.reset;
    if (!confirm(`确定重置${ISL[k]}吗？会清除${ISL[k]}已加入的行程，以及在${ISL[k]}线路里调整过的住宿晚数、活动、加选、接送机和日期。`)) return;
    resetIsland(k); const y = $('aside').scrollTop; render(); drawActive(); $('aside').scrollTop = y;
  });
  document.querySelectorAll('[data-cart-add]').forEach(b => b.onclick = () => { const r = OR.find(x => x.id === b.dataset.cartAdd); state.cart[islandOf(r)] = r.id; redo(); });
  document.querySelectorAll('[data-cart-rm]').forEach(b => b.onclick = e => { e.preventDefault(); state.cart[b.dataset.cartRm] = null; redo(); });
  document.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); setRoute(a.dataset.goto); });
}

function renderAll() {
  const rows = type => OR.filter(r => r.type === type).map(r => {
    const s = routeStats(r);
    return `<tr><td><span class="dot" style="background:${r.color}"></span><b>${r.name}</b></td>
      <td>${s.days}天</td><td>${s.km.toLocaleString()}</td><td>${Math.round(s.drive / 6) / 10}h</td><td>${mr(s.stay)}</td>
      <td>${mr(radd(fleetPrice(fleet()) * charterDays(r, s), deadheadFee(r, fleet()), rmul(s.stay, state.people)))}</td></tr>`;
  }).join('');
  const head = `<thead><tr><th>线路</th><th>行程天数</th><th>里程 km</th><th>驾车</th><th>住宿/人</th><th>包车+空驶+住宿*</th></tr></thead>`;
  const list = type => OR.filter(r => r.type === type).map(r => `<p style="margin:0 0 10px"><span class="dot" style="background:${r.color}"></span><b>${r.name} · ${r.sub}</b><br><span class="desc">${r.stops.map(id => PLACES[id].name).join(' → ')}</span></p>`).join('');
  $('#content').innerHTML = `
    <section>
      <h2>南岛经典线路对比（${PLACES[state.start].name}出发）</h2>
      <p class="desc">中线看雪山湖泊，东线看海岸野生动物，西线看冰川雨林；“中线 + 东线”环线首尾同城，一次看全。每条线路都可加选米尔福德峡湾、凯库拉、阿卡罗阿。</p>
      <table class="cmp">${head}<tbody>${rows('main')}</tbody></table>
    </section>
    <section>
      <h2>北岛线路（奥克兰出发）</h2>
      <table class="cmp">${head}<tbody>${rows('north')}</tbody></table>
      <p class="fine">* 按当前选择：${state.month} 月${seasonName()}，${state.people} 人，${fleetLabel(fleet())}（${money(fleetPrice(fleet()))}/天），不含活动。</p>
    </section>
    <section>
      <h2>途经地一览</h2>
      ${list('main')}${list('north')}
    </section>
    ${vehicleHtml(0)}
    <section style="border-bottom:0">${(() => { const cd = cartData(); state.quote = cd.segs.length ? cartFields(cd) : null;
      return cartHtml(cd) + (cd.segs.length ? inquiryHtml({ color: '#1d2327' }, null, cd.segs.map((x, i) => staySumHtml(x, cd.qs[i].pre, cd.segs.length > 1 ? ISL[islandOf(x)] + ' · ' : '')).join('')) : ''); })()}</section>`;
  bindVehicle();
  bindCart();
  bindInquiry();
}

function render() {
  const r = active();
  // 有填日期的线路，按出发日期所在月份显示淡旺季
  if (r && (dts(r).start || dts(r).arrive)) state.month = parseD(dts(r).start || dts(r).arrive).getMonth() + 1;
  renderTabs();
  r ? renderRoute(r) : renderAll();
  $('#tour').style.display = r ? '' : 'none';
  $('#tour').style.setProperty('--c', r ? r.color : '#1d2327');
}

function setRoute(id) {
  stopTour();
  state.route = id; state.days = null; state.tourIdx = -1;
  if (highlight) { map.removeLayer(highlight); highlight = null; }
  map.closePopup();
  render(); drawActive(); updateTourLbl();
  $('aside').scrollTop = 0;
}

/* ---------- 讲解模式 ---------- */
function updateTourLbl() {
  const r = active();
  if (!r) return;
  const i = state.tourIdx;
  $('#tourLbl').textContent = i < 0 ? '点击开始讲解' : `${i + 1}/${r.stops.length} ${PLACES[r.stops[i]].name}`;
  $('#play').textContent = state.playing ? '⏸ 暂停' : '▶ 讲解';
}
function go(d) {
  const r = active();
  if (!r.stops.length) return;
  state.tourIdx = Math.min(r.stops.length - 1, Math.max(0, state.tourIdx + d));
  focusStop(state.tourIdx); updateTourLbl();
}
function stopTour() { clearInterval(state.playing); state.playing = null; updateTourLbl(); }
$('#prev').onclick = () => { stopTour(); go(-1); };
$('#next').onclick = () => { stopTour(); go(1); };
$('#play').onclick = () => {
  if (state.playing) return stopTour();
  const r = active();
  if (!r || r.stops.length < 2) return;
  if (state.tourIdx >= r.stops.length - 1) state.tourIdx = -1;
  go(1);
  state.playing = setInterval(() => {
    if (state.tourIdx >= r.stops.length - 1) { stopTour(); drawActive(); return; }
    go(1);
  }, 5000);
  updateTourLbl();
};

buildLayers(); render(); drawActive(); updateTourLbl();
</script>
</body>
</html>
